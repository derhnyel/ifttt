name: ifttt
description: Check cross-file directives in a unified diff or scan a workspace.
inputs:
  change-set:
    description: 'Optional change-set YAML manifest selecting local repository snapshots. Callers must check out every declared repository.'
    required: false
    default: ''
  diff:
    description: 'Optional unified diff file. Otherwise PRs validate their revision range and pushes validate tracked files.'
    required: false
    default: ''
  args:
    description: 'Additional whitespace-separated CLI arguments (shell expansion and quotes are not interpreted).'
    required: false
    default: ''
  working-directory:
    description: Directory to run the checker in.
    required: false
    default: ''
  go-version:
    description: Optional Go version override; defaults to the module requirement.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - name: Build ifttt from action source
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        TOOL_BIN: ${{ runner.temp }}/ifttt/bin
      run: |
        set -euo pipefail
        mkdir -p "$TOOL_BIN"
        cd "$ACTION_ROOT"
        suffix=''
        if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
        go build -trimpath -o "$TOOL_BIN/ifttt$suffix" ./cmd/ifttt
        echo "$TOOL_BIN" >> "$GITHUB_PATH"
    - name: Run ifttt
      shell: bash
      env:
        CHANGE_SET_PATH: ${{ inputs.change-set }}
        DIFF_PATH: ${{ inputs.diff }}
        EXTRA_ARGS: ${{ inputs.args }}
        WORKDIR: ${{ inputs.working-directory }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        cd -P "${WORKDIR:-.}"
        if [ -n "$CHANGE_SET_PATH" ] && [ -n "$DIFF_PATH" ]; then
          echo 'The diff and change-set inputs cannot be combined.' >&2
          exit 2
        fi
        if [ "$DIFF_PATH" = '-' ]; then
          echo 'Action stdin is unavailable. Generate a diff file and pass its path.' >&2
          exit 2
        fi
        args=()
        EXTRA_ARGS="${EXTRA_ARGS//$'\r'/ }"
        EXTRA_ARGS="${EXTRA_ARGS//$'\n'/ }"
        read -r -a args <<< "$EXTRA_ARGS" || true
        if [ -n "$CHANGE_SET_PATH" ]; then
          ifttt --change-set "$CHANGE_SET_PATH" "${args[@]}" </dev/null
        elif [ -n "$DIFF_PATH" ]; then
          ifttt --vcs git "${args[@]}" "$DIFF_PATH" </dev/null
        elif [ "$EVENT_NAME" = pull_request ]; then
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'PR checks require full base and head revision IDs.' >&2
            exit 2
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo 'Check out the PR head revision before running ifttt (actions/checkout ref: github.event.pull_request.head.sha).' >&2
            exit 2
          fi
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow origin
            fi
          fi
          ifttt --vcs git "${args[@]}" --diff "${BASE_SHA}...${HEAD_SHA}" </dev/null
        elif [ "$EVENT_NAME" = push ]; then
          ifttt --vcs git "${args[@]}" '**/*' </dev/null
        elif [ "${#args[@]}" -gt 0 ]; then
          ifttt --vcs git "${args[@]}" </dev/null
        else
          ifttt --vcs git '**/*' </dev/null
        fi
