# Standard LINT.IfChange / LINT.ThenChange syntax is the default.
parallelism: auto
verbose: false
ignores: ["third_party/**"]
languages:
  python_docstrings: true
rules:
  unknown_directive: error   # warn|error|ignore
  combined_diff: skip_with_note
  code_only: false           # ignore whitespace/comment-only changes
output:
  format: text               # text|json|sarif|diagnostic-ls
  path: ""
