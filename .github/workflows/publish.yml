name: Publish Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      marketplace:
        description: Also publish the verified VSIX to VS Code Marketplace (stable tags only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  github:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: release
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify identity and download prepared assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          MARKETPLACE: ${{ inputs.marketplace }}
        run: |
          python3 scripts/release.py check --repository "$REPOSITORY" --tag "$RELEASE_TAG"
          if [[ "$MARKETPLACE" == true && "$RELEASE_TAG" == *-* ]]; then
            echo 'Marketplace publishing requires a stable tag.' >&2
            exit 1
          fi
          mkdir -p build/release
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir build/release
      - name: Publish verified draft without rebuilding
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          python3 scripts/release.py publish --repository "$REPOSITORY" --tag "$RELEASE_TAG" --commit "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Preserve exact validated Marketplace asset bytes
        if: ${{ inputs.marketplace }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-release
          path: build/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  marketplace:
    timeout-minutes: 10
    if: ${{ inputs.marketplace }}
    needs: github
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.github.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketplace-release
          path: build/release
      - name: Validate the same prepared assets
        env:
          RELEASE_COMMIT: ${{ needs.github.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release.py check --repository "$REPOSITORY" --tag "$RELEASE_TAG"
          python3 scripts/release.py verify --require-vsix --repository "$REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --smoke
      - name: Publish prepared VSIX
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo 'Configure VSCE_PAT in the release environment.' >&2; exit 1; }
          npm ci
          packages=(../build/release/*.vsix)
          test "${#packages[@]}" -eq 1
          npx --no-install vsce publish --packagePath "${packages[0]}" --skip-duplicate
