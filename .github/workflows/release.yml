name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, or leave empty to release the committed version on main
        required: false
        type: string
      publish:
        description: Publish after all checks and the release environment approval
        required: true
        default: true
        type: boolean
      marketplace:
        description: Also publish VS Code extension (requires VSCE_PAT; stable only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: prepare-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.metadata.outputs.ready }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          # Every release commit must already belong to the protected default branch.
          git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"
          if [[ "$EVENT_NAME" == push && -z "$RELEASE_TAG" ]]; then
            ready="$(python3 scripts/release.py select --repository "$REPOSITORY" --commit "$commit" --default-branch "$DEFAULT_BRANCH")"
            if [[ "$ready" != true ]]; then
              printf 'ready=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(python3 -c "import json; print('v' + json.load(open('vscode-extension/package.json'))['version'])")"
          fi
          python3 scripts/release.py check --repository "$REPOSITORY" --tag "$RELEASE_TAG"
          printf 'ready=true\ntag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  tests:
    if: needs.metadata.outputs.ready == 'true'
    needs: metadata
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  lint:
    if: needs.metadata.outputs.ready == 'true'
    needs: metadata
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  build:
    timeout-minutes: 15
    needs: [metadata, tests, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build versioned CLI assets
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: make release-build
      - name: Package licensed VSIX
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cp LICENSE vscode-extension/LICENSE
          cd vscode-extension
          npm ci
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--pre-release); fi
          npm run package -- --out ../build/release/ \
            --baseContentUrl "https://github.com/$REPOSITORY/blob/$RELEASE_TAG" \
            --baseImagesUrl "https://raw.githubusercontent.com/$REPOSITORY/$RELEASE_TAG" \
            "${flags[@]}"
      - name: Seal and validate complete release
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          python3 scripts/release.py seal
          python3 scripts/release.py verify --require-vsix --smoke --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ifttt-release
          path: build/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 90
  native-smoke:
    timeout-minutes: 5
    needs: [metadata, build]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ifttt-release
          path: build/release
      - name: Verify downloaded assets and execute native binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python scripts/release.py verify --require-vsix --smoke --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
  draft:
    concurrency:
      group: release-assets-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    timeout-minutes: 10
    needs: [metadata, build, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ifttt-release
          path: build/release
      - name: Create immutable version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/release.py tag --repository "$REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Check out the new Action version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          path: .local/release-action
          persist-credentials: false
      - name: Smoke-test the tagged composite Action
        uses: ./.local/release-action
        with:
          args: --scan test/extension-playground
      - name: Verify artifact behavior without publishing credentials
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/release.py verify --require-vsix --smoke --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Create or update draft with verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/release.py draft --run-id "${{ github.run_id }}" --repository "$REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
  publish:
    if: (github.event_name != 'workflow_dispatch' || inputs.publish) && needs.metadata.outputs.ready == 'true'
    needs: [metadata, draft]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
      artifact-run-id: ${{ fromJSON(github.run_id) }}
      marketplace: ${{ inputs.marketplace || vars.VSCODE_MARKETPLACE == 'true' }}
    secrets: inherit
