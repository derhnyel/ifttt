version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    ignore:
      # API declarations must match the minimum supported VS Code version.
      # Update this constraint when engines.vscode is raised.
      - dependency-name: '@types/vscode'
        versions: ['>1.88.0']
